# ========================================
# NETLIFY CONFIGURATION - LA CIMA RESTAURANTE
# ========================================

# Build command
[build]
  command = "echo 'Production build'"
  publish = "."
  functions = "netlify/functions"

# ========================================
# ESCANEO DE SECRETOS
# ========================================
# Netlify busca los VALORES de las variables de entorno dentro de los
# archivos publicados y bloquea el deploy si los encuentra.
#
# Solo se omiten estas dos, porque NO son secretos:
#  - WHATSAPP_NUMBER: el número está a la vista en la web a propósito
#    (index.html y js/config.js) para que los clientes escriban.
#  - NODE_ENV: su valor es "production", una palabra común.
#
# ADMIN_PASSWORD y ENCRYPTION_KEY se dejan protegidas a propósito: el
# escáner ya detectó una fuga real de ambas en SETUP-SEGURIDAD.md y
# SEGURIDAD-IMPLEMENTADA.md, que se publicaban en la web. No omitir.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "WHATSAPP_NUMBER,NODE_ENV"

# Environment variables (configurar en dashboard de Netlify)
# - ADMIN_PASSWORD
# - WHATSAPP_NUMBER
# - ENCRYPTION_KEY

# ========================================
# HEADERS DE SEGURIDAD
# ========================================

[[headers]]
  # Aplicar a todos los archivos
  for = "/*"

  [headers.values]
    # Content Security Policy - Protege contra XSS
    # Nota: script-src permite cualquier host HTTPS en vez de listar
    # dominios uno por uno. Firebase (gstatic.com) importa sub-módulos
    # internos dinámicamente desde rutas que una lista explícita de
    # dominios no cubre de forma confiable. Sigue bloqueado: http:,
    # data:/blob: como origen de script, y todo lo demás (object-src,
    # frame-ancestors, form-action) permanece restrictivo.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-src https://player.vimeo.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;"

    # X-Frame-Options - Protege contra clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # X-Content-Type-Options - Previene MIME sniffing
    X-Content-Type-Options = "nosniff"

    # X-XSS-Protection - Protege contra XSS (legacy)
    X-XSS-Protection = "1; mode=block"

    # Referrer-Policy - Controla información de referencia
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions-Policy - Controla APIs del navegador
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

    # HSTS - Fuerza HTTPS (incluye subdomios por 1 año)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ========================================
# HEADERS PARA HTML - SIN CACHE AGRESIVO
# ========================================
# Crítico: el HTML debe revalidarse siempre para que cambios de CSP,
# scripts, etc. lleguen de inmediato. Cachear HTML agresivamente
# causa que usuarios vean versiones desactualizadas por horas.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ========================================
# HEADERS ESPECÍFICOS PARA JS
# ========================================

[[headers]]
  for = "/js/*"
  [headers.values]
    # Sin "immutable": no hay versionado de nombres de archivo (hash),
    # así que un cache de 1 año "immutable" impediría que los usuarios
    # reciban futuros arreglos de bugs. max-age corto + revalidación.
    Cache-Control = "public, max-age=300, must-revalidate"

# ========================================
# HEADERS PARA CSS
# ========================================

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ========================================
# REDIRECTS PARA SEGURIDAD
# ========================================

# Bloquear acceso público a la documentación interna.
# Se publica toda la carpeta raíz (publish = "."), así que los .md
# quedaban legibles desde internet; SETUP-SEGURIDAD.md llegó a exponer
# la contraseña del admin. Ahora viven en docs/ y esa ruta se bloquea.
#
# Nota: Netlify NO soporta comodines de extensión ("/*.md" no funciona).
# El splat solo aplica a segmentos de ruta completos, como "/docs/*".
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

# Redirigir HTTP a HTTPS (Netlify lo hace automáticamente)
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirigir /admin a /admin-panel.html
[[redirects]]
  from = "/admin"
  to = "/admin-panel.html"
  status = 200

# Redirigir raíz a index.html
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# ========================================
# CONFIGURACIÓN DE FUNCIONES NETLIFY
# ========================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ========================================
# CONFIGURACIÓN DE DEPLOY
# ========================================

[context.production]
  command = "echo 'Production build'"
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  command = "echo 'Preview build'"

[context.branch-deploy]
  command = "echo 'Branch build'"
