# ========================================
# NETLIFY CONFIGURATION - LA CIMA RESTAURANTE
# ========================================

# Build command
[build]
  command = "echo 'Production build'"
  publish = "."
  functions = "netlify/functions"

# Environment variables (configurar en dashboard de Netlify)
# - ADMIN_PASSWORD
# - WHATSAPP_NUMBER
# - ENCRYPTION_KEY

# ========================================
# HEADERS DE SEGURIDAD
# ========================================

[[headers]]
  # Aplicar a todos los archivos
  for = "/*"

  [headers.values]
    # Content Security Policy - Protege contra XSS
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com https://*.firebaseapp.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' https: data:; connect-src 'self' https: wss: https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; frame-src https://player.vimeo.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;"

    # X-Frame-Options - Protege contra clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # X-Content-Type-Options - Previene MIME sniffing
    X-Content-Type-Options = "nosniff"

    # X-XSS-Protection - Protege contra XSS (legacy)
    X-XSS-Protection = "1; mode=block"

    # Referrer-Policy - Controla información de referencia
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions-Policy - Controla APIs del navegador
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

    # HSTS - Fuerza HTTPS (incluye subdomios por 1 año)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Esperaba que me hayas protegido contra la caducidad de cache
    Cache-Control = "public, max-age=3600"

# ========================================
# HEADERS ESPECÍFICOS PARA JS
# ========================================

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ========================================
# HEADERS PARA CSS
# ========================================

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ========================================
# REDIRECTS PARA SEGURIDAD
# ========================================

# Redirigir HTTP a HTTPS (Netlify lo hace automáticamente)
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirigir /admin a /admin-panel.html
[[redirects]]
  from = "/admin"
  to = "/admin-panel.html"
  status = 200

# Redirigir raíz a index.html
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# ========================================
# CONFIGURACIÓN DE FUNCIONES NETLIFY
# ========================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ========================================
# CONFIGURACIÓN DE DEPLOY
# ========================================

[context.production]
  command = "echo 'Production build'"
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  command = "echo 'Preview build'"

[context.branch-deploy]
  command = "echo 'Branch build'"
