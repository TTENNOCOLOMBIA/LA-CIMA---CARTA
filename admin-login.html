<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Cima - Admin Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #FFD700;
      --dark: #3d5a47;
      --black: #0f1419;
      --accent: #FF6B35;
      --madera: #3E2A1C;
      --madera2: #2A1C12;
      --texto: #F0E0C8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, var(--madera) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--texto);
    }

    .login-container {
      background: linear-gradient(135deg, var(--madera) 0%, var(--madera2) 100%);
      border: 3px solid var(--accent);
      border-radius: 20px;
      padding: 50px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 107, 53, 0.3);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-section img {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    }

    .logo-section h1 {
      color: var(--primary);
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .logo-section p {
      color: var(--accent);
      font-size: 14px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--texto);
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: rgba(240, 224, 200, 0.5);
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      color: var(--dark);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.5);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(231, 76, 60, 0.2);
      border: 2px solid #e74c3c;
      color: #ff9999;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: rgba(240, 224, 200, 0.6);
      margin-top: 30px;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      border: 4px solid rgba(255, 215, 0, 0.3);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .login-container {
        margin: 20px;
        padding: 40px 25px;
      }

      .logo-section h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-section">
      <img src="https://i.ibb.co/RpwLKSjg/1000869623-removebg-preview.png" alt="La Cima Logo">
      <h1>🔐 Admin Panel</h1>
      <p>La Cima Restaurante</p>
    </div>

    <!-- El login lo gestiona Netlify Identity. La contraseña nunca llega
         a este código ni viaja al navegador: se valida en el servidor de
         Netlify. Antes había un formulario propio con la contraseña
         escrita en este archivo, visible para cualquiera. -->
    <div class="error-message" id="errorMessage"></div>

    <button type="button" class="btn-login" id="btnLogin" onclick="abrirLogin()">
      Ingresar
    </button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <div class="footer-text">
      © 2026 La Cima Restaurante · Sistema Administrativo
    </div>
  </div>

  <!-- Widget de Netlify Identity. Debe cargar antes del script de abajo. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script>
    // El acceso lo gestiona Netlify Identity: la contraseña se valida en
    // el servidor y nunca aparece en este archivo. El registro está en
    // "Invite only", así que solo entran las personas invitadas desde
    // el panel de Netlify (Identity → Invite users).

    // ¿Venimos del correo de invitación o de recuperar contraseña?
    // El token llega en el hash de la URL; index.html reenvía aquí esos
    // enlaces, porque Netlify los manda a la raíz del sitio.
    //
    // IMPORTANTE: esto se calcula ANTES de netlifyIdentity.init(), porque el
    // widget LEE EL TOKEN Y BORRA EL HASH al arrancar. Si se consultara
    // location.hash más tarde (por ejemplo dentro de abrirLogin) ya estaría
    // vacío y se abriría el formulario equivocado.
    var hashInicial = window.location.hash || "";
    var esInvitacion = /^#invite_token=/.test(hashInicial);
    var esRecuperacion = /^#recovery_token=/.test(hashInicial);

    function mostrarError(mensaje) {
      const el = document.getElementById("errorMessage");
      el.textContent = mensaje;
      el.classList.add("show");
    }

    function abrirLogin() {
      if (typeof netlifyIdentity === "undefined") {
        mostrarError("No se pudo cargar el sistema de acceso. Revisa tu conexión y recarga la página.");
        return;
      }
      document.getElementById("errorMessage").classList.remove("show");
      // Con una invitación hay que abrir el formulario de registro, no el de
      // acceso: la cuenta todavía no existe, se está creando.
      netlifyIdentity.open(esInvitacion ? "signup" : "login");
    }

    if (typeof netlifyIdentity === "undefined") {
      mostrarError("No se pudo cargar el sistema de acceso. Revisa tu conexión y recarga la página.");
    } else {
      if (esInvitacion || esRecuperacion) {
        document.getElementById("btnLogin").textContent = esInvitacion
          ? "Crear mi contraseña"
          : "Cambiar mi contraseña";
      }

      // Si ya hay sesión abierta, entrar directo al panel.
      // No redirigir si hay un token pendiente: primero hay que completarlo.
      netlifyIdentity.on("init", function (user) {
        if (user && !esInvitacion && !esRecuperacion) {
          window.location.href = "admin-panel.html";
        }
      });

      netlifyIdentity.on("login", function () {
        document.getElementById("btnLogin").style.display = "none";
        document.getElementById("loading").style.display = "block";
        window.location.href = "admin-panel.html";
      });

      netlifyIdentity.on("error", function (err) {
        mostrarError("No se pudo iniciar sesión. Intenta de nuevo.");
        console.error("Netlify Identity:", err);
      });

      netlifyIdentity.init();
    }
  </script>

</body>
</html>
