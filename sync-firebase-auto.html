        async function syncNow() {
            try {
                document.getElementById('status').textContent = '🔗 Conectando a Firebase...';

                const app = initializeApp(firebaseConfig);
                const db = getDatabase(app);

                document.getElementById('status').textContent = '📤 Sincronizando menú...';

                await set(ref(db, 'menu'), defaultMenu);

                document.getElementById('status').textContent = '⚙️ Guardando configuración...';

                await set(ref(db, 'settings/sync_config'), {
                    lastSync: new Date().toISOString(),
                    autoSync: true,
                    syncDirection: 'admin_to_firebase',
                    preventStaleData: true,
                    version: 'v1.0-Aug31-2026'
                });

                document.getElementById('status').innerHTML = '✅ <strong>¡SINCRONIZACIÓN EXITOSA!</strong><br><br>Firebase está actualizado con el menú correcto del 31 de agosto.';

                setTimeout(() => {
                    window.location.href = 'http://localhost:8000/';
                }, 2000);

            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
                console.error(error);
            }
        }

        window.addEventListener('load', syncNow);
    </script>
</body>
